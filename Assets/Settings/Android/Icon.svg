<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sfondo Gradiente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20"/>
      <stop offset="100%" stop-color="#1a1835"/>
    </linearGradient>

    <!-- Gradiente Laser -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Gradiente Specchio -->
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e6ed"/>
      <stop offset="100%" stop-color="#8a9ba8"/>
    </linearGradient>

    <!-- Glow del Laser -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sfondo dell'Icona -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Specchio Geometrico -->
  <polygon points="256,120 380,360 132,360" fill="url(#mirrorGrad)" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <polygon points="256,120 380,360 256,360" fill="#ffffff" opacity="0.2"/>

  <!-- Raggio Laser Incidenta -->
  <line x1="60" y1="180" x2="256" y2="280" stroke="url(#laserGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Raggio Laser Riflesso -->
  <line x1="256" y1="280" x2="452" y2="140" stroke="url(#laserGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Punto d'Impatto (Flash) -->
  <circle cx="256" cy="280" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>
